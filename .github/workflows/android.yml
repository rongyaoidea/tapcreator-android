name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: 单测 (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint (debug)
        run: ./gradlew lintDebug --stacktrace --console=plain

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.*

  build-debug:
    name: 构建 Debug
    runs-on: ubuntu-latest
    needs: [unit-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tapcreator-debug
          path: app/build/outputs/apk/debug/*.apk

  build-release:
    name: 构建 Release
    runs-on: ubuntu-latest
    needs: [unit-test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare signing
        # 发布密钥唯一来源：GitHub Secrets（固定复用，见仓库 Settings → Secrets）。
        # Tag 发布构建若无 Secrets 直接失败，杜绝临时密钥导致签名漂移；
        # 日常 push/PR 无 Secrets 时用临时密钥兜底，保证流水线可跑通。
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.keystore
            printf 'keystoreFile=%s\nkeystorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$RUNNER_TEMP/release.keystore" \
              "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              "${{ secrets.ANDROID_KEY_ALIAS }}" \
              "${{ secrets.ANDROID_KEY_PASSWORD }}" > signing.properties
            echo "使用 Secrets 中的固定发布密钥签名"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Tag 发布构建缺少签名 Secrets（ANDROID_KEYSTORE_BASE64 等），拒绝用临时密钥签名"
            exit 1
          else
            keytool -genkeypair -keystore $RUNNER_TEMP/ci.keystore -alias ci -keyalg RSA -keysize 2048 \
              -validity 3650 -storepass android -keypass android -dname "CN=TapcreatorCI" -noprompt
            printf 'keystoreFile=%s\nkeystorePassword=android\nkeyAlias=ci\nkeyPassword=android\n' \
              "$RUNNER_TEMP/ci.keystore" > signing.properties
            echo "Secrets 缺失（非 Tag 构建），使用临时密钥签名"
          fi
          cp signing.properties app/signing.properties

      - name: Assemble release APK
        run: ./gradlew assembleRelease --stacktrace --console=plain

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk | head -8

      - name: Upload release APK + mapping
        uses: actions/upload-artifact@v4
        with:
          name: tapcreator-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt

  github-release:
    name: 发布 GitHub Release
    runs-on: ubuntu-latest
    needs: [build-release]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: tapcreator-release
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          APKS=$(find dist -name '*.apk' | tr '\n' ' ')
          echo "APKs: $APKS"
          # shellcheck disable=SC2086
          gh release create "$TAG" $APKS \
            --title "Tapcreator $TAG" \
            --notes "自动构建产物（CI 签名）。对应源码：$GITHUB_SHA" \
            --draft=false --prerelease=false
